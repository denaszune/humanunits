name: CI
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      # Installing the pinned CLI explicitly avoids Corepack's interactive
      # download prompt, which can wait indefinitely on a headless runner.
      - run: npm install --global pnpm@11.22.0
      - run: pnpm --version
      - run: pnpm install --frozen-lockfile
        timeout-minutes: 5
      - run: pnpm audit --prod
      - run: pnpm test
      - run: pnpm build
      - run: pnpm size
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: BASE_PATH=/humanunits/ pnpm build
      - run: TEST_BASE_PATH=/humanunits/ pnpm test:e2e
